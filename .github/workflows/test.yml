name: Tests

on: [push, pull_request]

jobs:
  test:
    name: Test with Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run pyrefly
        run: uv run pyrefly check

      - name: Run ruff
        run: uv run ruff check

      - name: Run tests
        run: uv run pytest
